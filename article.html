<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VÉLTOR</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="VÉLTOR"><span class="brand-mark">V</span><span><strong>VÉLTOR</strong><small>FÚTBOL INTERNACIONAL</small></span></a>
    <nav class="main-nav"><a href="index.html">← Inicio</a></nav>
  </header>
  <main class="reader">
    <p id="r-status">Cargando…</p>
    <article id="r-article" hidden>
      <p class="article-meta" id="r-meta"></p>
      <h1 id="r-title"></h1>
      <p class="reader-summary" id="r-summary"></p>
      <div class="reader-image" id="r-image" hidden></div>
      <div class="reader-body" id="r-body"></div>
    </article>
  </main>
  <footer><a class="brand footer-brand" href="index.html"><span class="brand-mark">V</span><span><strong>VÉLTOR</strong></span></a><p>Un proyecto editorial independiente en construcción.</p></footer>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="posts.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id), P = window.VeltorPosts;
      const id = new URLSearchParams(location.search).get("id");
      const fail = (t) => { $("r-status").textContent = t; };
      if (!P.enabled || !id) return fail("Artículo no encontrado.");
      try {
        const p = await P.loadOne(id);
        if (!p || !p.published) return fail("Artículo no encontrado.");
        document.title = p.title + " — VÉLTOR";
        $("r-meta").textContent = P.CATS.es[p.category] + " · " + P.fmtDate(p.createdAt) + " · " + P.minutes(p.body) + " MIN";
        $("r-title").textContent = p.title;
        $("r-summary").textContent = p.summary;
        const url = P.safeImg(p.imageUrl);
        if (url) { const i = $("r-image"); i.hidden = false; i.style.backgroundImage = 'url("' + encodeURI(url) + '")'; }
        p.body.split(/\n\s*\n/).forEach((t) => $("r-body").appendChild(P.el("p", "", t.trim())));
        $("r-status").hidden = true; $("r-article").hidden = false;
      } catch (e) { fail("Artículo no encontrado."); }
    })();
  </script>
</body>
</html>
